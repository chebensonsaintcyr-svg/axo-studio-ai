<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AXO Studio AI</title>
  <desc id="desc">Logo premium monocromática, letras metálicas brancas sobre fundo transparente.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.24" stop-color="#d9d9d9"/>
      <stop offset="0.48" stop-color="#686868"/>
      <stop offset="0.69" stop-color="#f9f9f9"/>
      <stop offset="1" stop-color="#9f9f9f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8f8" stop-opacity="0.12"/>
      <stop offset="0.28" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#5f5f5f" stop-opacity="0.35"/>
      <stop offset="0.82" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#999999" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="600" cy="250" rx="565" ry="210" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="15"/>
  <ellipse cx="600" cy="250" rx="565" ry="210" fill="none" stroke="url(#ring)" stroke-width="3" filter="url(#softGlow)"/>
  <text x="600" y="286" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="276" font-weight="900" letter-spacing="-14" fill="url(#metal)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5">AXO</text>
  <text x="600" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="500" letter-spacing="23" fill="#f5f5f5">STUDIO AI</text>
</svg>