name: Build AXO Reel with fresh narration

on:
  push:
    paths:
      - "assets/axo-reel-rebuild.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate fresh narration and render the Reel
        run: python scripts/build-axo-reel.py

      - name: Commit validated video and cover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/axo-reel-v3.mp4 assets/axo-reel-v3-cover.jpg
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            exit 0
          fi
          git commit -m "Add AXO Reel v3 with refreshed narration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
